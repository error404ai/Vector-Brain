services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vector-brain-prod
    restart: always
    env_file: .env
    ports:
      - '${EXTERNAL_PORT:-3002}:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vector-brain-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  db:
    image: mysql:8.0
    container_name: vector-brain-mysql-prod
    restart: always
    ports:
      - '${MYSQL_EXTERNAL_PORT:-3306}:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQLPASSWORD}
      - MYSQL_DATABASE=${DATABASE}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQLPASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vector-brain-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vector-brain-phpmyadmin-prod
    restart: always
    ports:
      - '${PHPMYADMIN_PORT:-8082}:80'
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=100M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vector-brain-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vector-brain-qdrant-prod
    restart: always
    ports:
      - '${QDRANT_PORT:-6333}:6333'
      - '${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - qdrant_data_prod:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test:
        - CMD
        - bash
        - -lc
        - >
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q '200'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vector-brain-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  mysql_data_prod:
  qdrant_data_prod:

networks:
  vector-brain-network:
    driver: bridge
