name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up SSH
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Test SSH Connection
        run: |
          ssh -v -o StrictHostKeyChecking=no root@62.72.26.9 exit

      # Step 3: Deploy to VPS
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@62.72.26.9 << 'EOF'
            set -e
            cd /var/www/Vector-Brain
            git stash
            git pull origin production
            docker compose -f docker-compose-prod.yml build
            
            # Stop and remove containers with force to handle stuck containers
            docker compose -f docker-compose-prod.yml down --timeout 30 --remove-orphans || true
            
            # Force remove any stuck containers
            docker rm -f vector-brain-prod vector-brain-mysql-prod vector-brain-phpmyadmin-prod 2>/dev/null || true
            
            docker builder prune -f
            docker compose -f docker-compose-prod.yml up --build -d
          EOF
