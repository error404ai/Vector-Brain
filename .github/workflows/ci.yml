# Phase 0 — build gate.
#
# All work is pushed to `develop`. This workflow builds the backend and the
# frontend exactly as the production Dockerfile does. Only if both builds pass
# does it fast-forward `production` to the same commit, which is what Coolify
# watches and deploys. A change that doesn't compile can never reach production.
name: Build gate

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: build-gate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24 (same as Dockerfile.prod)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Backend — install
        run: pnpm install --frozen-lockfile

      - name: Backend — build (tsc)
        run: pnpm run build

      - name: Frontend — install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend — build (tsc + vite)
        working-directory: frontend
        run: pnpm run build

      # Fast-forward only. If someone pushed straight to production and it is no
      # longer an ancestor of develop, this fails loudly instead of overwriting.
      - name: Promote to production
        run: |
          git config user.name  "build-gate"
          git config user.email "build-gate@users.noreply.github.com"
          git push origin HEAD:production
