services:
  mysql:
    image: mysql:8.4
    container_name: vector-brain-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQLPASSWORD:-password}
      MYSQL_DATABASE: ${DATABASE:-vector_brain}
    ports:
      - '${MYSQL_EXTERNAL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${MYSQLPASSWORD:-password}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: vector-brain-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQLPASSWORD:-password}
      UPLOAD_LIMIT: 100M
    ports:
      - '${PHPMYADMIN_PORT:-8080}:80'
    depends_on:
      mysql:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vector-brain-qdrant
    restart: unless-stopped
    ports:
      - '${QDRANT_PORT:-6333}:6333'
      - '${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333

volumes:
  mysql_data:
  qdrant_data:
