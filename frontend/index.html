<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />

    <title>Vector Brain — AI agents that run your real Android phone</title>
    <meta
      name="description"
      content="Give an AI agent a task in plain English and watch it carry it out on a real Android phone, step by step. Bring your own API key. Free to use."
    />

    <!-- Link previews. app.vectoragent.in/r/:token overrides these per shared run. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vector Brain" />
    <meta property="og:title" content="Vector Brain — AI agents that run your real Android phone" />
    <meta
      property="og:description"
      content="Give an AI agent a task in plain English and watch it carry it out on a real Android phone, step by step."
    />
    <meta property="og:url" content="https://app.vectoragent.in" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vector Brain — AI agents that run your real Android phone" />
    <meta
      name="twitter:description"
      content="Give an AI agent a task in plain English and watch it carry it out on a real Android phone, step by step."
    />
  </head>
  <body>
    <!-- Painted before any script loads; React replaces it when the app starts. -->
    <style>
      .vb-boot{position:fixed;inset:0;display:grid;place-items:center;background:#f8fafc}
      .vb-boot i{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:#2563eb;animation:vb-boot 1s ease-in-out infinite}
      .vb-boot i:nth-child(2){animation-delay:.15s}.vb-boot i:nth-child(3){animation-delay:.3s}
      @keyframes vb-boot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){.vb-boot i{animation:none;opacity:.6}}
    </style>
    <div id="root"><div class="vb-boot" role="status" aria-label="Loading"><span><i></i><i></i><i></i></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
