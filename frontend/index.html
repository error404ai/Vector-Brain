    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />

    <!--seo:start-->
    <title>FLEET by Vector Brain — AI Android Automation for Real Phones</title>
    <meta
      name="description"
      content="Describe a task in plain words and an AI does it on real Android phones — one phone or up to 1,000. No root, no ADB, no USB. Watch every screen live. Free to use."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FLEET by Vector Brain" />
    <meta property="og:title" content="FLEET by Vector Brain — AI Android Automation for Real Phones" />
    <meta property="og:description" content="Describe a task in plain words and an AI does it on real Android phones — one phone or up to 1,000." />

    <!--seo:end-->
  </head>
  <body>
    <!-- Painted before any script loads; React replaces it when the app starts. -->
    <style>
      .vb-boot{position:fixed;inset:0;display:grid;place-items:center;background:#f8fafc}
      .vb-boot i{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:#2563eb;animation:vb-boot 1s ease-in-out infinite}
      .vb-boot i:nth-child(2){animation-delay:.15s}.vb-boot i:nth-child(3){animation-delay:.3s}
      @keyframes vb-boot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){.vb-boot i{animation:none;opacity:.6}}
    </style>
    <div id="root"><!--app:start--><div class="vb-boot" role="status" aria-label="Loading"><span><i></i><i></i><i></i></span></div><!--app:end--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
